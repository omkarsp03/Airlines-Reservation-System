<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Seats - SkyWings Airlines</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="particles" id="particles"></div>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">✈️</span>
                <span class="logo-text">SkyWings</span>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/flights" class="nav-link">Flights</a>
                <th:block th:if="${currentUser != null}">
                    <a href="/my-bookings" class="nav-link">My Bookings</a>
                    <a href="/logout" class="nav-link btn-logout">Logout</a>
                </th:block>
                <th:block th:if="${currentUser == null}">
                    <a href="/login" class="nav-link">Login</a>
                    <a href="/register" class="nav-link btn-register">Register</a>
                </th:block>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="booking-confirmation-container">
            <div class="hero-content">
                <h1 class="hero-title mb-4">Select Your Seats</h1>
                <p class="hero-subtitle mb-4">
                    Flight: <span th:text="${flight.flightNumber}"></span> | 
                    Class: <span th:text="${seatClass}"></span> |
                    Passengers: <span th:text="${passengers}"></span>
                </p>
            </div>

            <div class="flight-card mb-4">
                <div class="seat-selection">
                    <div class="seat-legend mb-4">
                        <div class="legend-item">
                            <div class="seat available"></div>
                            <span>Available</span>
                        </div>
                        <div class="legend-item">
                            <div class="seat selected"></div>
                            <span>Selected</span>
                        </div>
                        <div class="legend-item">
                            <div class="seat occupied"></div>
                            <span>Occupied</span>
                        </div>
                    </div>

                    <div class="seat-map">
                        <div class="front-indicator mb-4">
                            <span>Front of Plane</span>
                        </div>
                        
                        <div class="seat-rows" id="seatMap">
                            <!-- Seats will be rendered dynamically -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="flight-card">
                <div class="flight-details">
                    <h4>Selected Seats: <span id="selectedSeatsCount">0</span>/<span th:text="${passengers}"></span></h4>
                    <p class="hero-subtitle" id="selectedSeatsList">None selected</p>
                    <button class="btn-primary" id="proceedBtn" disabled onclick="proceedToBooking()">
                        Proceed to Booking
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
    <script th:inline="javascript">
        let selectedSeats = [];
        const maxSeats = /*[[${passengers}]]*/ '1';
        const flightId = /*[[${flight.id}]]*/ '1';
        const seatClass = /*[[${seatClass}]]*/ 'ECONOMY';

        // Load seats
        window.addEventListener('DOMContentLoaded', function() {
            loadSeats();
        });

        function loadSeats() {
            fetch('/api/seats/' + flightId)
                .then(response => response.json())
                .then(data => {
                    renderSeatMap(seatClass === 'ECONOMY' ? data.economySeats : data.businessSeats);
                });
        }

        function renderSeatMap(seats) {
            const seatMapContainer = document.getElementById('seatMap');
            seatMapContainer.innerHTML = '';

            // Group seats by row
            const rows = {};
            seats.forEach(seat => {
                let rowNum;
                if (seatClass === 'ECONOMY') {
                    rowNum = seat.seatNumber.match(/\d+/)[0];
                } else {
                    rowNum = seat.seatNumber.match(/\d+/)[0];
                }
                
                if (!rows[rowNum]) {
                    rows[rowNum] = [];
                }
                rows[rowNum].push(seat);
            });

            // Render each row
            Object.keys(rows).sort((a, b) => parseInt(a) - parseInt(b)).forEach(rowNum => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'seat-row';
                rowDiv.innerHTML = '<span class="row-number">' + rowNum + '</span>';

                const seatsInRow = rows[rowNum].sort((a, b) => a.seatNumber.localeCompare(b.seatNumber));
                
                // Add seats
                seatsInRow.forEach(seat => {
                    const seatDiv = document.createElement('div');
                    seatDiv.className = 'seat';
                    if (seat.isOccupied) {
                        seatDiv.classList.add('occupied');
                    } else {
                        seatDiv.classList.add('available');
                        seatDiv.onclick = function() { toggleSeat(seat.seatNumber, seatDiv); };
                    }
                    let seatLabel = seat.seatNumber.replace(/\d+/g, '').replace('B', '');
                    seatDiv.textContent = seatLabel;
                    seatDiv.dataset.seatNumber = seat.seatNumber;
                    rowDiv.appendChild(seatDiv);
                });

                seatMapContainer.appendChild(rowDiv);
            });
        }

        function toggleSeat(seatNumber, seatElement) {
            const index = selectedSeats.indexOf(seatNumber);
            if (index > -1) {
                selectedSeats.splice(index, 1);
                seatElement.classList.remove('selected');
                seatElement.classList.add('available');
            } else {
                if (selectedSeats.length < maxSeats) {
                    selectedSeats.push(seatNumber);
                    seatElement.classList.remove('available');
                    seatElement.classList.add('selected');
                }
            }
            updateSelectedSeats();
        }

        function updateSelectedSeats() {
            document.getElementById('selectedSeatsCount').textContent = selectedSeats.length;
            document.getElementById('selectedSeatsList').textContent = selectedSeats.length > 0 ? selectedSeats.join(', ') : 'None selected';
            document.getElementById('proceedBtn').disabled = selectedSeats.length !== maxSeats;
        }

        function proceedToBooking() {
            let params = 'flightId=' + flightId + '&passengers=' + maxSeats + '&seatClass=' + seatClass;
            selectedSeats.forEach(seat => {
                params += '&selectedSeats=' + encodeURIComponent(seat);
            });
            window.location.href = '/booking?' + params;
        }
    </script>
</body>
</html>
