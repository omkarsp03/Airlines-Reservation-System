<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - SkyWings Airlines</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">✈️</span>
                <span class="logo-text">SkyWings</span>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/flights" class="nav-link">Flights</a>
                <a href="/my-bookings" class="nav-link active">My Bookings</a>
                <a href="/logout" class="nav-link btn-logout">Logout</a>
            </div>
        </div>
    </nav>

    <section class="bookings-section">
        <div class="container">
            <h1 class="section-title">My Bookings</h1>
            
            <div class="bookings-list">
                <div th:each="booking : ${bookings}" class="booking-card">
                    <div class="booking-header">
                        <div>
                            <span class="booking-ref" th:text="${booking.bookingReference}"></span>
                            <span class="booking-date" th:text="'Booked on ' + ${#temporals.format(booking.bookingDate, 'dd MMM yyyy')}"></span>
                        </div>
                        <span class="booking-status" th:text="${booking.status}"></span>
                    </div>
                    <div class="booking-route">
                        <div class="route-point">
                            <div class="city" th:text="${booking.flight.departureCity}"></div>
                            <div class="time" th:text="${#temporals.format(booking.flight.departureTime, 'HH:mm')}"></div>
                            <div class="date" th:text="${#temporals.format(booking.flight.departureTime, 'dd MMM')}"></div>
                        </div>
                        <div class="route-arrow">→</div>
                        <div class="route-point">
                            <div class="city" th:text="${booking.flight.arrivalCity}"></div>
                            <div class="time" th:text="${#temporals.format(booking.flight.arrivalTime, 'HH:mm')}"></div>
                            <div class="date" th:text="${#temporals.format(booking.flight.arrivalTime, 'dd MMM')}"></div>
                        </div>
                    </div>
                    <div class="booking-details">
                        <div class="detail-item">
                            <span class="label">Flight</span>
                            <span class="value" th:text="${booking.flight.flightNumber}"></span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Passengers</span>
                            <span class="value" th:text="${booking.numPassengers}"></span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Total</span>
                            <span class="value price" th:text="'₹' + ${booking.totalAmount}"></span>
                        </div>
                    </div>
                </div>

                <div th:if="${bookings == null or bookings.isEmpty()}" class="no-bookings">
                    <div class="no-bookings-icon">📋</div>
                    <h3>No bookings yet</h3>
                    <p>Start exploring and book your first flight!</p>
                    <a href="/flights" class="btn-primary">Browse Flights</a>
                </div>
            </div>
        </div>
    </section>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
